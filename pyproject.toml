[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farming-env"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
    "accelerate>=0.34.0",
    "numpy>=1.24",
]
train-extras = [
    "wandb>=0.18.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["server"]
py-modules = ["models"]
